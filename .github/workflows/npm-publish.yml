name: Publish Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v1.1.4)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ startsWith(github.event.release.tag_name || inputs.tag, 'v') && (github.event.release.tag_name || inputs.tag) || format('v{0}', github.event.release.tag_name || inputs.tag) }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify package version matches release tag
        run: test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish
